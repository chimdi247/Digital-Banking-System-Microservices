global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Grafana-managed alert rules (observability/grafana/provisioning/alerting/)
# query this Prometheus datasource directly, so no separate
# rule_files/Alertmanager block is needed here -- this project asked
# for Grafana-managed alerts specifically, not Alertmanager.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # All 6 services are Spring Boot, so they share the exact same
  # Actuator/Micrometer metric conventions -- one consistent scrape
  # pattern and one consistent set of metric names across every
  # dashboard/alert. See observability/README.md.
  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:8081"]
        labels: { service: account-service }

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:8082"]
        labels: { service: transaction-service }

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8083"]
        labels: { service: payment-service }

  - job_name: fraud-detection-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fraud-detection-service:8084"]
        labels: { service: fraud-detection-service }

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]
        labels: { service: notification-service }

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: { service: api-gateway }

  # Host (node) CPU/memory/disk utilization.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
