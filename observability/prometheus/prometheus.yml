global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrics forwarded by the OTel Collector's prometheus exporter
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # (Spring Boot actuator jobs unchanged)
  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:8081"]
        labels: { service: account-service }

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:8082"]
        labels: { service: transaction-service }

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8083"]
        labels: { service: payment-service }

  - job_name: fraud-detection-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fraud-detection-service:8084"]
        labels: { service: fraud-detection-service }

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]
        labels: { service: notification-service }

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: { service: api-gateway }

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
    # Per-container CPU/memory/network utilization.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]    
