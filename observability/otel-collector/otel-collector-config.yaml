receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # The frontend (src/otel.js) posts spans directly from the
          # browser to this collector's OTLP/HTTP port -- without this,
          # the browser blocks the request as a cross-origin request
          # the server never explicitly allowed. Add your real frontend
          # origin here if you change FRONTEND_PORT / deploy behind a
          # domain.
          allowed_origins:
            - "http://35.226.68.168:3000"
            - "http://localhost:*"
          allowed_headers:
            - "*"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  resource:
    attributes:
      - key: deployment.environment
        value: docker-compose
        action: upsert

exporters:
  # Traces -> Tempo.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics -> exposed on :8889 for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Logs -> Loki's native OTLP ingestion endpoint.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/loki, debug]

  telemetry:
    logs:
      level: info
