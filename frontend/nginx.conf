# JSON access logs for Promtail. log_format must be at http level, which is
# where the official nginx image includes conf.d/*.conf, so it sits above server.
log_format json_combined escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"x_forwarded_for":"$http_x_forwarded_for",'
  '"method":"$request_method","uri":"$request_uri",'
  '"status":$status,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time",'
  '"body_bytes_sent":$body_bytes_sent,"referer":"$http_referer",'
  '"user_agent":"$http_user_agent"}';

# Rate limit for the public trace endpoint (anyone can POST to it)
limit_req_zone $binary_remote_addr zone=otlp_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;

    # Docker's embedded DNS. Using variables in proxy_pass below means nginx
    # resolves the upstream at request time, so it still starts if the
    # gateway or collector is down or restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml font/ttf font/otf;

    # Liveness probe, not logged
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------- Reverse proxy: API gateway ----------------

    # Browser calls /api/v1/accounts -> gateway receives /api/v1/accounts (prefix kept)
  location /api/ {
      set $gateway http://api-gateway:8080;
      proxy_pass $gateway;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";

      proxy_connect_timeout 5s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
      client_max_body_size  10m;

      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
  }

    # ---------------- Reverse proxy: browser traces -> OTel collector ----------------
    # Browser posts to /otlp/v1/traces -> collector receives /v1/traces
    location /otlp/ {
        limit_req zone=otlp_limit burst=40 nodelay;
        limit_except POST OPTIONS { deny all; }

        set $collector http://otel-collector:4318;
        rewrite ^/otlp/(.*)$ /$1 break;
        proxy_pass $collector;

        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection      "";

        proxy_read_timeout   10s;
        client_max_body_size 1m;
    }

    # Hashed build assets: cache for a year; a missing file is a real 404
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never cache the entry point, so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback for client-side routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
